<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}riskscope: free security scanner{% endblock %}</title>
  <meta name="description" content="Free security scanner for websites and code: a risk grade and a prioritised list of fixes.">
  <meta name="theme-color" content="#2457d6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="riskscope">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">riskscope</a>
    <nav><a href="/how-it-works">How it works</a> <a href="/api/docs">API</a>
      <a href="https://github.com/alifjegham-wq/Riskscope">Source</a></nav>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer>
    Free and open source (AGPL-3.0). Only scan sites and code you own or are authorised to test.
    Uploaded code is processed in memory and never stored.
  </footer>
</body>
</html>
