# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/alifjegham-wq/Riskscope
# See docs/DEPLOY.md for the step-by-step (works from a phone browser).
#
# This uses Render's FREE instance type: scans work, but the instance sleeps after 15 minutes without
# visitors (the next visit takes up to a minute to wake it) and its disk is wiped on every restart, so
# shareable links and monitoring are switched off (RISKSCOPE_PERSISTENT_STORAGE=false).
#
# To unlock sharing and monitoring (paid), make all four changes below, then add the SMTP variables
# (see docs/DEPLOY.md). Monitoring also needs the database on the persistent disk, or monitors and
# groups are still lost on restart.
#   1. plan: starter
#   2. add this disk block under the service:
#        disk:
#          name: riskscope-data
#          mountPath: /data
#          sizeGB: 1
#   3. RISKSCOPE_PERSISTENT_STORAGE: "true"
#   4. RISKSCOPE_DATABASE_PATH: "/data/riskscope.db"   # must live on the mounted disk
services:
  - type: web
    name: riskscope
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # HMAC key for ownership tokens. Generated once; never change it afterwards.
      - key: RISKSCOPE_VERIFY_SECRET
        generateValue: true
      - key: RISKSCOPE_PERSISTENT_STORAGE
        value: "false"
      # Render's proxy puts the real visitor IP first in X-Forwarded-For (used for rate limiting),
      # and uvicorn must trust its forwarded headers to know requests arrived over https.
      - key: RISKSCOPE_TRUST_PROXY
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: RISKSCOPE_SCANS_PER_HOUR
        value: "20"
      # --- Email for monitoring (only used once persistent storage is on, above) ---
      # Add these from your SMTP provider (Brevo, Resend, Postmark, Mailgun all have free tiers).
      # Use sync: false so the secrets are entered in the Render dashboard, never committed here.
      # - key: RISKSCOPE_SMTP_HOST
      #   sync: false
      # - key: RISKSCOPE_SMTP_PORT
      #   value: "587"
      # - key: RISKSCOPE_SMTP_USERNAME
      #   sync: false
      # - key: RISKSCOPE_SMTP_PASSWORD
      #   sync: false
      # - key: RISKSCOPE_SMTP_FROM
      #   value: "riskscope <alerts@yourdomain.com>"
