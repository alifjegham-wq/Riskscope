# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/alifjegham-wq/Riskscope
# See docs/DEPLOY.md for the step-by-step (works from a phone browser).
#
# This uses Render's FREE instance type: scans work, but the instance sleeps after 15 minutes without
# visitors (the next visit takes up to a minute to wake it) and its disk is wiped on every restart, so
# shareable links and monitoring are switched off (RISKSCOPE_PERSISTENT_STORAGE=false).
#
# To unlock sharing and monitoring later (paid): set plan to "starter", add the disk block below,
# set RISKSCOPE_PERSISTENT_STORAGE to "true", and add the SMTP variables from docs/DEPLOY.md.
#    disk:
#      name: riskscope-data
#      mountPath: /data
#      sizeGB: 1
services:
  - type: web
    name: riskscope
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # HMAC key for ownership tokens. Generated once; never change it afterwards.
      - key: RISKSCOPE_VERIFY_SECRET
        generateValue: true
      - key: RISKSCOPE_PERSISTENT_STORAGE
        value: "false"
      # Render's proxy puts the real visitor IP first in X-Forwarded-For (used for rate limiting),
      # and uvicorn must trust its forwarded headers to know requests arrived over https.
      - key: RISKSCOPE_TRUST_PROXY
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: RISKSCOPE_SCANS_PER_HOUR
        value: "20"
